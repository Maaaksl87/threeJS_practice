<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Modular Cube</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <!-- Canvas, де Three.js малюватиме 3D сцену -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Панель керування -->
    <div id="ui-container">
        <div class="input-group">
            <label for="input-x">X:</label>
            <input type="number" id="input-x" min="1" max="10" value="3" />
        </div>
        <div class="input-group">
            <label for="input-y">Y:</label>
            <input type="number" id="input-y" min="1" max="10" value="3" />
        </div>
        <div class="input-group">
            <label for="input-z">Z:</label>
            <input type="number" id="input-z" min="1" max="10" value="3" />
        </div>
        <button id="btn-generate">Generate</button>
        <button id="btn-explode">Explode</button>
        <button id="btn-collect">Collect</button>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
